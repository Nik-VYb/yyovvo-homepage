<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>yyovvo — Spread the Love™</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="This Christmas, SPREAD THE LOVE™ — the viral game everyone’s playing." />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1.05;
      font-weight: 700;
      max-width: 900px;
      margin-bottom: 16px;
    }

    .sub {
      font-size: clamp(16px, 2.5vw, 20px);
      opacity: 0.85;
      max-width: 600px;
      margin-bottom: 32px;
    }

    .ctas {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }

    .cta-primary {
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      box-shadow: 0 0 40px rgba(236,72,153,0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta-primary:hover {
      transform: scale(1.03);
      box-shadow: 0 0 60px rgba(236,72,153,0.9);
    }

    .cta-secondary {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }

    footer {
      position: absolute;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- HERO VIDEO (KEEP CURRENT FILE PATH) -->
    <video autoplay muted loop playsinline>
      <source src="/hero.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>

    <div class="content">
      <div class="kicker">christmas 2025 · the viral game</div>

      <h1>
        This Christmas,<br />
        <strong>SPREAD THE LOVE™</strong>
      </h1>

      <div class="sub">
        Create a character. Send a talking message.<br />
        ❤️ Every send sparks another.
      </div>

      <div class="ctas">
        <button
          class="cta-primary"
          onclick="window.location.href='https://studio.yyovvo.com/GameHome?src=home_hero';"
        >
          Enter the Game →
        </button>

        <button
          class="cta-secondary"
          onclick="window.location.href='https://studio.yyovvo.com/Leaderboard?src=home_leaderboard';"
        >
          View Leaderboard
        </button>
      </div>
    </div>

    <footer>
      © yyovvo · designed for emotion
    </footer>

  </div>
</body>
</html>
